<html><body><span class="title" id="LabelName">CC 681</span><span id="LabelDocument"><p align="justify" class="A0001">Art 681.  Opening in common wall.</p>
<p align="justify" class="A0002">The co-owner of a common wall may not make any opening in the wall without the consent of his neighbor.</p>
<p align="justify" class="A0002">Acts 1977, No. 514, §1.</p></span></body></html>
