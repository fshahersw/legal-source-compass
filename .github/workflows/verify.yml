name: Verify application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          # 3.13 matches src/lib/semantic/fixtures/chunk-golden.json, whose Unicode tables come from the generating Python
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/test/requirements.txt
      # The lockfile resolves some packages through Lovable's npm mirror, which answers HTTP 429 when it is busy;
      # retry the same frozen install with backoff instead of failing the run on a temporary rate limit.
      - name: Install dependencies (frozen lockfile, retried on rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if bun install --frozen-lockfile; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "bun install failed (attempt $attempt of 4); retrying in $((attempt * 45))s"
              sleep $((attempt * 45))
            fi
          done
          exit 1
      - run: python -m pip install -r scripts/test/requirements.txt
      - run: npm run verify
      - run: npm install --prefix private/tools/publisher-code-contract-tests --no-audit --no-fund @electric-sql/pglite@0.5.8
      - run: npm run test:sql
